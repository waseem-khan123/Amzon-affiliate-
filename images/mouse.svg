<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="100" fill="#E2E8F0" opacity="0.6"/>
  <!-- Ergonomic Vertical Mouse Contour -->
  <path d="M 150 220 C 130 180, 140 100, 190 70 C 230 45, 260 80, 260 140 C 260 200, 240 230, 200 230 Z" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
  <!-- Left/Right Click Separator -->
  <path d="M 200 70 L 200 125" stroke="#475569" stroke-width="3"/>
  <!-- Scroll Wheel with Orange Accent -->
  <rect x="194" y="85" width="12" height="28" rx="6" fill="#FF9900"/>
  <!-- Thumb Rest Curve -->
  <path d="M 145 160 C 120 180, 130 210, 160 215" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round"/>
  <!-- DPI Button -->
  <rect x="195" y="125" width="10" height="10" rx="3" fill="#64748B"/>
</svg>
