<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131921"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid and circles -->
  <circle cx="500" cy="80" r="120" fill="#FF9900" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="380" r="160" fill="#007185" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Central Tech Device Composition -->
  <!-- Smartwatch -->
  <g transform="translate(140, 160)">
    <!-- Watch Straps -->
    <rect x="45" y="-50" width="50" height="50" rx="10" fill="#334155"/>
    <rect x="45" y="110" width="50" height="50" rx="10" fill="#334155"/>
    <!-- Watch Case -->
    <rect x="25" y="0" width="90" height="110" rx="28" fill="#0F172A" stroke="#475569" stroke-width="3"/>
    <!-- Watch Screen -->
    <rect x="33" y="8" width="74" height="94" rx="20" fill="#1E293B"/>
    <!-- UI Elements -->
    <circle cx="70" cy="50" r="26" fill="none" stroke="#FF9900" stroke-width="4" stroke-dasharray="120 40"/>
    <text x="70" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">10:42</text>
    <text x="70" y="75" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">⚡ 88%</text>
  </g>

  <!-- ANC Headphones -->
  <g transform="translate(290, 80)">
    <!-- Headband -->
    <path d="M 40 150 C 40 40, 200 40, 200 150" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
    <path d="M 60 140 C 60 70, 180 70, 180 140" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round"/>
    <!-- Left Ear Cup -->
    <g transform="translate(10, 140)">
      <rect x="0" y="0" width="40" height="75" rx="18" fill="#0F172A" stroke="#FF9900" stroke-width="3"/>
      <rect x="8" y="8" width="24" height="59" rx="12" fill="#334155"/>
    </g>
    <!-- Right Ear Cup -->
    <g transform="translate(190, 140)">
      <rect x="0" y="0" width="40" height="75" rx="18" fill="#0F172A" stroke="#FF9900" stroke-width="3"/>
      <rect x="8" y="8" width="24" height="59" rx="12" fill="#334155"/>
    </g>
  </g>

  <!-- Wireless Earbuds Case & Earbud -->
  <g transform="translate(260, 240)">
    <!-- Case -->
    <rect x="0" y="40" width="110" height="85" rx="30" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <line x1="0" y1="75" x2="110" y2="75" stroke="#475569" stroke-width="2"/>
    <circle cx="55" cy="95" r="4" fill="#10B981"/>
    <!-- Floating Earbud -->
    <g transform="translate(130, 20)">
      <ellipse cx="25" cy="20" rx="18" ry="14" fill="#FFFFFF"/>
      <rect x="20" y="24" width="9" height="35" rx="4" fill="#E2E8F0"/>
      <circle cx="25" cy="18" r="4" fill="#FF9900"/>
    </g>
  </g>

  <!-- Floating Badge: Verified Tech Reviews -->
  <g transform="translate(50, 60)">
    <rect width="180" height="44" rx="22" fill="#0F172A" stroke="#FF9900" stroke-width="2"/>
    <circle cx="26" cy="22" r="12" fill="#FF9900"/>
    <path d="M 21 22 L 25 26 L 31 18" fill="none" stroke="#131921" stroke-width="2.5" stroke-linecap="round"/>
    <text x="46" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Verified Tech Reviews</text>
  </g>

  <!-- Floating Badge: Curated Amazon Deals -->
  <g transform="translate(370, 350)">
    <rect width="190" height="44" rx="22" fill="#0F172A" stroke="#007185" stroke-width="2"/>
    <text x="24" y="27" fill="#FF9900" font-family="system-ui, sans-serif" font-size="15">★</text>
    <text x="44" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Top Amazon Tech Picks</text>
  </g>
</svg>
