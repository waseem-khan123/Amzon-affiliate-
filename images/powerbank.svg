<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="100" fill="#E2E8F0" opacity="0.6"/>
  <!-- Power Bank Body -->
  <rect x="130" y="60" width="140" height="180" rx="20" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
  <!-- Digital Display for Percentage -->
  <rect x="155" y="80" width="90" height="35" rx="8" fill="#0F172A"/>
  <text x="200" y="103" fill="#10B981" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">98 %</text>
  <!-- Brand text -->
  <text x="200" y="145" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">20,000 mAh</text>
  <!-- Fast Charge Tag -->
  <rect x="160" y="160" width="80" height="22" rx="11" fill="#FF9900"/>
  <text x="200" y="175" fill="#131921" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">22.5W FAST</text>
  <!-- Port cuts on top edge -->
  <rect x="160" y="55" width="22" height="6" rx="2" fill="#475569"/>
  <rect x="190" y="55" width="20" height="6" rx="2" fill="#475569"/>
  <rect x="218" y="55" width="22" height="6" rx="2" fill="#475569"/>
</svg>
