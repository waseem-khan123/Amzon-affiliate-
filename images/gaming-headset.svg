<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="100" fill="#E2E8F0" opacity="0.6"/>
  <!-- Headband -->
  <path d="M 120 180 C 120 70, 280 70, 280 180" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round"/>
  <!-- RGB Line -->
  <path d="M 135 160 C 135 90, 265 90, 265 160" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <!-- Left Cup with Mic -->
  <g transform="translate(90, 150)">
    <polygon points="0,20 45,0 45,85 0,65" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
    <!-- Mic boom -->
    <path d="M 25 70 Q 25 110, 80 115" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="115" r="7" fill="#FF9900"/>
  </g>
  <!-- Right Cup -->
  <g transform="translate(265, 150)">
    <polygon points="45,20 0,0 0,85 45,65" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
  </g>
</svg>
