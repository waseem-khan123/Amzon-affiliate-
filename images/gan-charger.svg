<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="100" fill="#E2E8F0" opacity="0.6"/>
  <!-- Charger Main Body -->
  <rect x="135" y="80" width="130" height="140" rx="18" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <!-- Foldable AC Prongs -->
  <rect x="160" y="55" width="12" height="30" rx="3" fill="#94A3B8"/>
  <rect x="228" y="55" width="12" height="30" rx="3" fill="#94A3B8"/>
  <!-- Power text / Logo -->
  <text x="200" y="115" fill="#FF9900" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">65W GaN</text>
  <!-- USB-C Port 1 -->
  <rect x="175" y="130" width="50" height="12" rx="4" fill="#1E293B" stroke="#007185" stroke-width="2"/>
  <text x="200" y="139" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">PD 1</text>
  <!-- USB-C Port 2 -->
  <rect x="175" y="152" width="50" height="12" rx="4" fill="#1E293B" stroke="#007185" stroke-width="2"/>
  <text x="200" y="161" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">PD 2</text>
  <!-- USB-A Port -->
  <rect x="175" y="176" width="50" height="18" rx="3" fill="#1E293B" stroke="#FF9900" stroke-width="2"/>
  <rect x="180" y="180" width="40" height="4" fill="#FF9900"/>
</svg>
