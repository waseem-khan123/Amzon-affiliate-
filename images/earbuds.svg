<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="100" fill="#E2E8F0" opacity="0.6"/>
  <!-- Charging Case -->
  <rect x="120" y="100" width="160" height="120" rx="40" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <path d="M 120 150 Q 200 160 280 150" fill="none" stroke="#E2E8F0" stroke-width="3"/>
  <circle cx="200" cy="180" r="4" fill="#10B981"/>
  <!-- Left Earbud -->
  <g transform="translate(100, 60)">
    <ellipse cx="30" cy="30" rx="22" ry="18" fill="#0F172A"/>
    <rect x="24" y="38" width="12" height="42" rx="6" fill="#334155"/>
    <circle cx="30" cy="28" r="6" fill="#FF9900"/>
  </g>
  <!-- Right Earbud -->
  <g transform="translate(240, 60)">
    <ellipse cx="30" cy="30" rx="22" ry="18" fill="#0F172A"/>
    <rect x="24" y="38" width="12" height="42" rx="6" fill="#334155"/>
    <circle cx="30" cy="28" r="6" fill="#FF9900"/>
  </g>
</svg>
